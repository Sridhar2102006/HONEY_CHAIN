name: HoneyChain CI Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Lint, Test, Web Build & Capacitor Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beecrypt

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend & Backend Dependencies
        run: |
          npm ci
          npm --prefix server ci

      - name: Run Static Analysis (ESLint)
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Automated Test Suite (Hermetic & CI Ready)
        run: npm run test:ci

      - name: Build Web Application
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_MOBILE_API_BASE_URL: https://api.honeychain.app/api/v1

      - name: Validate Capacitor Sync
        run: npx cap sync

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage Debug APK
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/HoneyChain-Android-debug.apk

      - name: Upload Debug APK Artifact for Testing
        uses: actions/upload-artifact@v4
        with:
          name: HoneyChain-Android-debug-apk
          path: beecrypt/apk-output/HoneyChain-Android-debug.apk
          if-no-files-found: error
