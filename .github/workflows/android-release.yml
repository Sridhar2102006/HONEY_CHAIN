name: Android Production Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release Target Channel (production or staging)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-android:
    name: Build Signed Android AAB & APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beecrypt

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build
        env:
          VITE_APP_ENV: ${{ github.event.inputs.release_channel || 'production' }}
          VITE_MOBILE_API_BASE_URL: ${{ (github.event.inputs.release_channel == 'staging') && 'https://staging-api.honeychain.app/api/v1' || 'https://api.honeychain.app/api/v1' }}

      - name: Sync Native Android Platform
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Keystore from Secret
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build Android APKs (Debug & Release) and AAB
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -f "app/release.keystore" ]; then
            echo "Building with release keystore..."
          else
            echo "Keystore secret not set; using development fallback signing for real device installation..."
          fi
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Stage Android APKs
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/HoneyChain-Android-debug.apk
          # Find generated release APK (signed or unsigned)
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" apk-output/HoneyChain-Android-release.apk
          fi

      - name: Upload Installable Android APKs (Debug + Release)
        uses: actions/upload-artifact@v4
        with:
          name: HoneyChain-Android-APKs
          path: beecrypt/apk-output/*.apk
          if-no-files-found: error

      - name: Upload Android App Bundle (AAB for Future Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: HoneyChain-Android-release-aab
          path: beecrypt/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
