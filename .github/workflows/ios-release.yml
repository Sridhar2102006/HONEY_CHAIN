name: iOS TestFlight Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release Target Channel (production or staging)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-ios:
    name: Build iOS Archive
    runs-on: macos-14
    defaults:
      run:
        working-directory: beecrypt

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: beecrypt/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build
        env:
          VITE_APP_ENV: ${{ github.event.inputs.release_channel || 'production' }}
          VITE_MOBILE_API_BASE_URL: ${{ (github.event.inputs.release_channel == 'staging') && 'https://staging-api.honeychain.app/api/v1' || 'https://api.honeychain.app/api/v1' }}

      - name: Sync Native iOS Platform
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build and Archive iOS (Placeholder for Fastlane / Xcodebuild signing)
        run: |
          echo "CocoaPods dependencies resolved. Native Xcode project ready for signing via Fastlane match or xcodebuild."
          # xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release archive -archivePath build/App.xcarchive
