version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: honeychain-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://honeyuser:honeypassword@postgres:5432/honeychain_dev?sslmode=disable
      - MONGODB_URI=mongodb://mongodb:27017/ESP32CAM
      - JWT_SECRET=honeychain_docker_isolated_jwt_secret_min32chars_2026
      - SENSOR_DEVICE_KEY=beecrypt_sensor_secret_key_2026
      - ALLOW_TEST_LOOPBACK=false
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - honeychain-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: honeychain-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=honeychain_dev
      - POSTGRES_USER=honeyuser
      - POSTGRES_PASSWORD=honeypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - honeychain-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeyuser -d honeychain_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0-alpine
    container_name: honeychain-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - honeychain-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongodb_data:

networks:
  honeychain-net:
    driver: bridge
